<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LDWH — Linchain Dev Work Home</title>
<style>
  :root{--bg:#0f1419;--panel:#1a2129;--border:#2e3a47;--txt:#dce3ea;--dim:#8b9aab;--accent:#4fc3f7;--bad:#ef5350;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--txt);font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:36px 32px;width:340px;}
  h1{font-size:20px;color:#fff;margin-bottom:4px;}
  .sub{font-size:12px;color:var(--dim);margin-bottom:24px;}
  label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px;}
  input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;
    background:#0a0e12;color:var(--txt);font-size:14px;}
  input:focus{outline:none;border-color:var(--accent);}
  button{width:100%;margin-top:20px;padding:11px;border:none;border-radius:8px;background:var(--accent);
    color:#06202e;font-size:15px;font-weight:bold;cursor:pointer;}
  button:disabled{opacity:.5;cursor:wait;}
  .err{color:var(--bad);font-size:12.5px;margin-top:12px;min-height:18px;text-align:center;}
  .foot{margin-top:18px;font-size:11px;color:var(--dim);text-align:center;}
</style>
</head>
<body>
<div class="card">
  <h1>🔐 LDWH</h1>
  <div class="sub">Linchain Dev Work Home — 가족 홈페이지 테스트</div>
  <form id="f">
    <label>아이디</label><input id="uid" autocomplete="username" required>
    <label>비밀번호</label><input id="upw" type="password" autocomplete="current-password" required>
    <button id="btn" type="submit">로그인</button>
    <div class="err" id="err"></div>
  </form>
  <div class="foot">인증 성공 시 보호 문서가 열립니다</div>
</div>

const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));

async function deriveKey(pass){
  const mat = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(VAULT.salt), iterations:VAULT.iter, hash:"SHA-256"},
    mat, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function tryOpen(key){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(VAULT.iv)}, key, b64(VAULT.ct));
  const html = new TextDecoder().decode(pt);
  const raw = await crypto.subtle.exportKey("raw", key);
  sessionStorage.setItem("ldwh_k", btoa(String.fromCharCode(...new Uint8Array(raw))));
  document.open(); document.write(html); document.close();
}

    await tryOpen(await deriveKey(pass));
  }catch(_){
    err.textContent="아이디 또는 비밀번호가 올바르지 않습니다.";
    btn.disabled=false; btn.textContent="로그인";
  }
});
// 세션 캐시 자동 로그인 (탭 유지 중)
(async()=>{
  const c = sessionStorage.getItem("ldwh_k");
  if(!c) return;
  try{
    const key = await crypto.subtle.importKey("raw", b64(c), {name:"AES-GCM"}, true, ["decrypt"]);
    await tryOpen(key);
  }catch(_){ sessionStorage.removeItem("ldwh_k"); }
})();
</script>
